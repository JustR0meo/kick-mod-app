<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kick Mod Paneli</title>
<style>
:root{--bg:#0b0e0f;--p:#14191b;--p2:#1b2124;--b:#2a3236;--t:#e8eeee;--m:#8a9a9d;--g:#53fc18;--r:#ff4d4d;--y:#ffc233;--o:#ff8a3d;--bl:#2f7bff;--pk:#e040fb}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--p);border-bottom:1px solid var(--b);flex-wrap:wrap;position:relative;z-index:50}
header b.logo{color:var(--g);font-size:16px}
input,select,button,textarea{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--b);border-radius:6px;padding:5px 9px}
input:focus,textarea:focus{outline:1px solid var(--g)}
button{cursor:pointer}button:hover{border-color:var(--g)}
.pri{background:var(--g);color:#000;border-color:var(--g);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--r)}.dot.on{background:var(--g)}
.small{color:var(--m);font-size:12px}
.mode{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--p2);border:1px solid var(--b)}.mode.ok{border-color:var(--g);color:var(--g)}
#login{text-decoration:none}
#menu{position:absolute;top:100%;left:0;background:var(--p);border:1px solid var(--b);border-radius:8px;padding:8px;display:none;min-width:200px;box-shadow:0 8px 24px #000a}
#menu.show{display:block}#menu label{display:flex;gap:8px;padding:3px 4px;cursor:pointer}
#wsp{position:relative;flex:1;overflow:auto}
.pn{position:absolute;display:flex;flex-direction:column;background:var(--p);border:1px solid var(--b);border-radius:10px;resize:both;overflow:hidden;min-width:200px;min-height:110px;box-shadow:0 4px 16px #0008}
.ph{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--p2);border-bottom:1px solid var(--b);cursor:move;user-select:none;font-weight:600;font-size:13px}
.ph i{font-style:normal;cursor:pointer;color:var(--m);padding:0 4px}.ph i:hover{color:var(--r)}
.pb{flex:1;overflow:auto;min-height:0;padding:10px}.pb.col{display:flex;flex-direction:column;padding:0}
.tools{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid var(--b);flex-wrap:wrap;align-items:center}
.tools input[type=text]{flex:1;min-width:100px}
label.c{color:var(--m);display:flex;gap:4px;align-items:center;font-size:13px}
#feed{flex:1;overflow-y:auto;padding:4px 0}
.msg{padding:4px 10px;margin:2px 6px;border:2px solid transparent;border-radius:6px;word-break:break-word}
.msg:hover{background:var(--p2)}
.msg.flag{border-color:var(--o);background:#ff8a3d12}
.msg.alert{border-color:var(--r);background:#ff4d4d22;box-shadow:0 0 0 1px #ff4d4d66,0 0 14px #ff4d4d44;font-size:15px;font-weight:700}
.msg.mod{border-color:var(--bl);background:#2f7bff18}
.msg.vip{border-color:var(--pk);background:#e040fb14}
.msg.sys{color:var(--m);font-size:12px}
.msg.evt{border-color:var(--y);background:#ffc23320;font-weight:700}
.msg.evt.ban{border-color:var(--r);background:#ff4d4d2e}.msg.evt.del{border-color:var(--o)}
.msg.deleted .tx{text-decoration:line-through;opacity:.5}
.ts{color:var(--m);font-size:11px;margin-right:6px;font-variant-numeric:tabular-nums}
.u{font-weight:700;cursor:pointer}.u:hover{text-decoration:underline}
.bi{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;font-size:12px;border-radius:4px;margin-right:3px;vertical-align:-3px;background:var(--b);cursor:default;position:relative}
.bi.moderator{background:#2f7bff40}.bi.broadcaster{background:#ff4d4d40}.bi.vip{background:#e040fb40}.bi.subscriber,.bi.sub_gifter{background:#1e8a3d55}.bi.og{background:#ffc23340}.bi.verified{background:#53fc1830}
.bi sub{position:absolute;right:-3px;bottom:-4px;font-size:8px;font-weight:700;background:#1e8a3d;color:#fff;border-radius:3px;padding:0 2px;line-height:10px}
.why{font-size:10px;background:var(--o);color:#000;border-radius:4px;padding:1px 5px;margin-left:6px}
.why.r{background:var(--r);color:#fff;font-size:11px;font-weight:700}
.act{display:inline-flex;gap:2px;margin-right:6px;vertical-align:-2px;opacity:.7}.msg:hover .act{opacity:1}
.act b{font-size:12px;line-height:16px;padding:1px 4px;border-radius:5px;background:var(--p2);border:1px solid var(--b);cursor:pointer;user-select:none;font-weight:600}
.act b:hover{border-color:var(--y);color:var(--y)}.act b[data-a=ban]:hover,.act b[data-a=del]:hover{border-color:var(--r);background:#ff4d4d33}
#pbar{display:none;padding:6px 10px;background:var(--y);color:#000;font-weight:700;font-size:13px;text-align:center;cursor:pointer}#pbar.on{display:block}
#upop{position:fixed;z-index:80;width:330px;max-height:min(560px,90vh);overflow:auto;background:var(--p);border:1px solid var(--b);border-radius:10px;box-shadow:0 12px 32px #000c;padding:12px;display:none}
#upop.on{display:block}
.uph{display:flex;align-items:center;gap:6px;margin-bottom:8px}.uph b{font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uph i{font-style:normal;cursor:pointer;color:var(--m);padding:0 4px}.uph i:hover{color:var(--g)}
.ugrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}.ugrid .stat{padding:6px}.ugrid .stat b{font-size:15px}
.kv{font-size:12px;color:var(--m);margin-bottom:8px}.kv div{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dashed var(--b)}.kv div b{color:var(--t);font-weight:600}
body.drag iframe{pointer-events:none}
#pwrap iframe{width:100%;height:100%;border:0;display:block}
.erow{padding:5px 8px;border-radius:6px;margin-bottom:5px;background:var(--p2);border-left:3px solid var(--m);font-size:13px}
.erow.ban{border-color:var(--r)}.erow.del{border-color:var(--o)}.erow.sub{border-color:var(--g)}.erow.gift{border-color:var(--pk)}.erow.rew{border-color:var(--bl)}.erow.unban{border-color:var(--y)}
.btns{display:flex;gap:6px;flex-wrap:wrap}.btns button{flex:1;min-width:52px;padding:5px 4px;font-size:13px}
.tm:hover{border-color:var(--y);color:var(--y)}
.bn{border-color:#ff4d4d55;color:var(--r)}.bn:hover{background:var(--r);color:#fff}
.hist{max-height:170px;overflow-y:auto;font-size:13px;color:var(--m)}.hist div{padding:2px 0;border-bottom:1px dashed var(--b)}
textarea{width:100%;min-height:56px;resize:vertical}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--p2);border-radius:8px;padding:8px}.stat b{font-size:18px;display:block}.stat span{color:var(--m);font-size:11px}
.tag{display:inline-block;background:var(--p2);border:1px solid var(--b);border-radius:12px;padding:2px 8px;margin:2px;font-size:12px}
.tag i{cursor:pointer;color:var(--r);margin-left:4px;font-style:normal}.tag.on{border-color:var(--g);color:var(--g)}
.live{display:inline-block;font-weight:700;padding:2px 10px;border-radius:12px;background:var(--p2);color:var(--m)}.live.on{background:var(--r);color:#fff}
.ttl{font-size:15px;font-weight:700;margin:8px 0 2px}
h4{margin:12px 0 6px;font-size:12px;text-transform:uppercase;color:var(--m);letter-spacing:.05em}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}.row>span{min-width:92px;color:var(--m);font-size:13px}.row input{flex:1;min-width:80px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--g);color:#000;padding:8px 14px;border-radius:8px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:99}
#toast.s{opacity:1}
</style>
</head>
<body>
<header>
  <b class="logo">⚡ Kick Mod</b><span class="dot" id="dot"></span>
  <input id="slug" placeholder="Kanal adı" style="width:130px">
  <input id="room" placeholder="Chatroom ID" style="width:115px" inputmode="numeric">
  <button class="pri" id="go">Bağlan</button>
  <button id="help" title="Chatroom ID'yi elle bulmak için">ID?</button>
  <span id="who" class="small"></span><span id="mode" class="mode">Komut kopyalama modu</span>
  <a id="login" href="/login"><button class="pri">Kick ile giriş yap</button></a><button id="logout" style="display:none">Çıkış</button>
  <span style="flex:1"></span>
  <button id="menubtn">▦ Paneller</button>
  <button id="reset" title="Panelleri varsayılan yerine al">Düzeni sıfırla</button>
  <button id="upd" title="Güncellemeleri kontrol et">⟳ <span id="ver">v?</span></button>
  <div id="menu"></div>
</header>
<div id="wsp"></div>
<div id="upop"></div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=d=>{const x=d?new Date(d):new Date();return isNaN(x)?'--:--':x.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})};
const full=d=>{const x=d?new Date(d):new Date();return isNaN(x)?'':x.toLocaleString('tr-TR')};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('s');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('s'),1800)}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Kopyalandı: '+t)).catch(()=>prompt('Kopyala:',t))}
async function api(p,body){
  const r=await fetch(p,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('Hata '+r.status));
  return j;
}

/* ================= PANELLER ================= */
const P=[
['chat','💬 Sohbet',{x:8,y:8,w:620,h:660},`<div class="pb col"><div class="tools"><input type="text" id="search" placeholder="Mesaj veya kullanıcı ara…"><label class="c"><input type="checkbox" id="onlyflag"> İşaretli</label><label class="c" title="Alt tuşunu basılı tuttuğun sürece de duraklar"><input type="checkbox" id="pause"> Duraklat (Alt)</label><button id="clear">Temizle</button></div><div id="feed"></div><div id="pbar"></div></div>`],
['player','🎬 Yayın izle',{x:1302,y:8,w:540,h:350},`<div class="pb col"><div class="tools"><label class="c"><input type="checkbox" id="pmute"> Sessiz başlat</label><button id="pload">Yükle / yenile</button><button id="pstop">Durdur</button><span class="small" id="pinfo"></span></div><div id="pwrap" style="flex:1;background:#000;min-height:0;display:flex;align-items:center;justify-content:center"><span class="small">Kanala bağlanınca yayın burada açılır.</span></div></div>`],
['events','📣 Etkinlik akışı',{x:636,y:8,w:340,h:320},`<div class="pb" id="evlog"><div class="small">Ban, timeout, silinen mesaj, abonelik, hediye ve ödül olayları burada canlı akar.</div></div>`],
['stream','📺 Yayın bilgisi',{x:984,y:8,w:310,h:320},`<div class="pb" id="streambox"></div>`],
['stats','📊 İstatistikler',{x:636,y:336,w:340,h:332},`<div class="pb" id="statbox"></div>`],
['actions','🛠 Kanal eylemleri',{x:984,y:336,w:310,h:420},`<div class="pb">
 <label class="c"><input type="checkbox" id="banconfirm"> 🔨 Kalıcı ban öncesi onay sor</label>
 <label class="c"><input type="checkbox" id="direct"> Komutları doğrudan gönder (deneysel)</label>
 <div class="small" style="margin:4px 0 8px">Kapalıyken komutu kopyalar, Kick sohbetine yapıştırırsın.</div>
 <div class="row"><span>Yavaş mod</span><div class="btns"><button data-cmd="/slow 5">5s</button><button data-cmd="/slow 30">30s</button><button data-cmd="/slow off">Kapat</button></div></div>
 <div class="row"><span>Sadece takipçi</span><div class="btns"><button data-cmd="/followonly">Aç</button><button data-cmd="/followonly off">Kapat</button></div></div>
 <div class="row"><span>Emote modu</span><div class="btns"><button data-cmd="/emoteonly on">Aç</button><button data-cmd="/emoteonly off">Kapat</button></div></div>
 <div class="row"><span>Abone modu</span><div class="btns"><button data-cmd="/subonly on">Aç</button><button data-cmd="/subonly off">Kapat</button></div></div>
 <div class="row"><button data-cmd="/clear" style="flex:1">🧹 Sohbeti temizle</button></div>
 <div class="row"><input id="ttl" placeholder="Yeni yayın başlığı"><button id="ttlb">Değiştir</button></div>
 <h4>Hızlı mesajlar (sen belirle)</h4><div id="qmlist"></div>
 <div class="row"><input id="qml" placeholder="Etiket" style="max-width:90px"><input id="qmt" placeholder="Gönderilecek mesaj"><button id="qmadd">Ekle</button></div>
</div>`],
['user','👤 Kullanıcı',{x:636,y:676,w:340,h:300},`<div class="pb" id="uinfo"><div class="small">Sohbette bir kullanıcı adına tıkla.</div></div>`],
['filters','🚨 Filtreler',{x:984,y:764,w:310,h:300},`<div class="pb">
 <h4 style="margin-top:0">Yasaklı kelimeler</h4>
 <div class="row"><input id="bw" placeholder="kelime ekle"><button id="bwadd">Ekle</button></div><div id="bwlist"></div>
 <h4>Otomatik işaretleme</h4>
 <label class="c"><input type="checkbox" id="fLink"> Link</label><label class="c"><input type="checkbox" id="fCaps"> Aşırı büyük harf</label>
 <label class="c"><input type="checkbox" id="fRep"> Tekrar / spam</label><label class="c"><input type="checkbox" id="fLong"> Çok uzun mesaj</label>
</div>`],
];
let layout=store.get('layout',{}),zTop=10;
const wsp=$('wsp');
P.forEach(([id,title,def,html])=>{
  const L={...def,vis:true,...(layout[id]||{})};
  const d=document.createElement('div');d.className='pn';d.id='pn-'+id;
  d.style.cssText=`left:${L.x}px;top:${L.y}px;width:${L.w}px;height:${L.h}px;z-index:${L.z||++zTop};display:${L.vis?'flex':'none'}`;
  d.innerHTML=`<div class="ph"><span>${title}</span><i title="Gizle" data-hide="${id}">✕</i></div>${html}`;
  wsp.appendChild(d);
});
function saveLayout(){
  const o={};P.forEach(([id])=>{const d=$('pn-'+id);o[id]={x:d.offsetLeft,y:d.offsetTop,w:d.offsetWidth,h:d.offsetHeight,vis:d.style.display!=='none',z:+d.style.zIndex||10}});
  store.set('layout',o);
}
let rsT;const ro=new ResizeObserver(()=>{clearTimeout(rsT);rsT=setTimeout(saveLayout,400)});
P.forEach(([id])=>ro.observe($('pn-'+id)));
function front(d){d.style.zIndex=++zTop}
function showPanel(id){const d=$('pn-'+id);d.style.display='flex';front(d);saveLayout();buildMenu()}
wsp.addEventListener('pointerdown',e=>{
  const pn=e.target.closest('.pn');if(pn)front(pn);
  const h=e.target.closest('.ph');if(!h||e.target.dataset.hide)return;
  const sx=e.clientX,sy=e.clientY,ox=pn.offsetLeft,oy=pn.offsetTop;
  const mv=ev=>{pn.style.left=Math.max(0,Math.round((ox+ev.clientX-sx)/4)*4)+'px';pn.style.top=Math.max(0,Math.round((oy+ev.clientY-sy)/4)*4)+'px'};
  document.body.classList.add('drag');
  addEventListener('pointermove',mv);
  addEventListener('pointerup',()=>{removeEventListener('pointermove',mv);document.body.classList.remove('drag');saveLayout()},{once:true});
});
// panelin sağ alt köşesinden boyutlandırırken yayın penceresi fareyi yutmasın
wsp.addEventListener('pointerdown',e=>{const pn=e.target.closest('.pn');if(pn&&!e.target.closest('.ph')){const r=pn.getBoundingClientRect();if(e.clientX>r.right-18&&e.clientY>r.bottom-18){document.body.classList.add('drag');addEventListener('pointerup',()=>document.body.classList.remove('drag'),{once:true})}}});
wsp.addEventListener('click',e=>{const h=e.target.dataset&&e.target.dataset.hide;if(h){$('pn-'+h).style.display='none';if(h==='player')stopPlayer();saveLayout();buildMenu()}});
function buildMenu(){
  $('menu').innerHTML=P.map(([id,t])=>`<label><input type="checkbox" data-p="${id}" ${$('pn-'+id).style.display!=='none'?'checked':''}> ${t}</label>`).join('');
}
$('menu').addEventListener('change',e=>{const id=e.target.dataset.p;if(!id)return;if(e.target.checked){showPanel(id);if(id==='player')loadPlayer()}else{$('pn-'+id).style.display='none';if(id==='player')stopPlayer();saveLayout()}});
$('menubtn').onclick=e=>{e.stopPropagation();buildMenu();$('menu').classList.toggle('show')};
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))$('menu').classList.remove('show')});
$('reset').onclick=()=>{if(confirm('Tüm paneller varsayılan yerine dönsün mü?')){store.set('layout',{});location.reload()}};

/* ================= DURUM ================= */
let ws=null,auth=false,bid=null,users={},total=0,flagged=0,cur=null,msgEls={},counts={ban:0,del:0,unban:0},mins={},SI=null,MODES=null,PEAK=0;
let badWords=store.get('badWords',[]),notes=store.get('notes',{}),qm=store.get('qm',[{l:'Linkler yasak',t:'Lütfen link paylaşmayın.'},{l:'Spam yok',t:'Lütfen spam yapmayın.'}]);
$('slug').value=store.get('slug','');$('room').value=store.get('room','');
const FL=store.get('filters',{fLink:1,fCaps:1,fRep:1,fLong:1});
['fLink','fCaps','fRep','fLong'].forEach(k=>{$(k).checked=!!FL[k];$(k).onchange=()=>{FL[k]=$(k).checked?1:0;store.set('filters',FL)}});
$('direct').checked=!!store.get('direct',0);$('direct').onchange=()=>store.set('direct',$('direct').checked?1:0);
$('banconfirm').checked=!!store.get('banconfirm',1);$('banconfirm').onchange=()=>store.set('banconfirm',$('banconfirm').checked?1:0);
$('pmute').checked=!!store.get('pmute',0);$('pmute').onchange=()=>store.set('pmute',$('pmute').checked?1:0);

$('help').onclick=()=>{const s=$('slug').value.trim()||'kanaladi';alert('Chatroom ID otomatik bulunamazsa:\n\n1) Tarayıcıda aç: https://kick.com/api/v2/channels/'+s+'\n2) "chatroom":{"id": yazan yerdeki sayıyı kopyala\n3) Chatroom ID kutusuna yapıştır, Bağlan\'a bas.')};

/* ================= BAĞLANTI ================= */
async function connect(){
  const slug=$('slug').value.trim();let room=$('room').value.trim();bid=null;
  if(slug&&auth){try{const c=await api('/api/channel?slug='+encodeURIComponent(slug));bid=c.broadcaster_user_id;SI=c;SI.fetched=Date.now();renderStream();sys('Kanal bulundu, ban/timeout yetkisi hazır ✔')}catch(e){sys('Kanal bilgisi alınamadı ('+e.message+'). Butonlar komut kopyalayacak.')}}
  if(!room&&slug){try{const c=await api('/api/chatroom?slug='+encodeURIComponent(slug));room=String(c.chatroom_id);$('room').value=room}catch(e){sys('Chatroom ID otomatik bulunamadı. "ID?" butonuna bak.')}}
  updMode();
  if(!/^\d+$/.test(room)){toast('Geçerli bir Chatroom ID gir');return}
  store.set('slug',slug);store.set('room',room);
  if($('pn-player').style.display!=='none')loadPlayer();
  if(ws)ws.close();
  ws=new EventSource('/api/stream?room='+room+'&slug='+encodeURIComponent(slug)+(bid?'&bid='+bid:''));
  ws.onmessage=e=>{let x;try{x=JSON.parse(e.data)}catch(err){return}
    if(x.status){sys(x.status);if(x.down)$('dot').classList.remove('on');return}
    if(x.ready){$('dot').classList.add('on');sys('Bağlandı: chatrooms.'+room+'.v2 ✔');return}
    if(x.pusher)handlePusher(x.pusher)};
  ws.onerror=()=>$('dot').classList.remove('on');
}
$('go').onclick=connect;
function J(m){try{return JSON.parse(m.data)}catch(e){return null}}
function handlePusher(m){
  const ev=m.event.replace(/^App\\Events\\/,'');const d=J(m);if(!d)return;
  if(ev==='ChatMessageEvent')onMsg(d);
  else if(ev==='MessageDeletedEvent'){
    const id=d.message&&d.message.id||d.id;let info='',who='';counts.del++;const me=msgEls[id];
    if(me){me.classList.add('deleted');info=me.querySelector('.tx').textContent.slice(0,80);who=me.dataset.u||'';const du=users[who];if(du){du.deleted=(du.deleted||0)+1;refreshPop(who)}}
    // Kick silenin adını göndermiyor: önce olaydaki alanlara bak, sonra panelden silinmiş mi, sonra AutoMod mu
    const by=(d.deleted_by&&(d.deleted_by.username||d.deleted_by.slug))||(d.deletedBy&&d.deletedBy.username)||(d.moderator&&d.moderator.username)||'';
    let byTxt=by?by:myDeletes.has(String(id))?'sen (panel)':d.aiModerated?'🤖 Kick AutoMod'+((d.violatedRules||[]).length?' ('+d.violatedRules.join(', ')+')':''):'';
    const r=evt('🗑 '+(who?who+' kullanıcısının mesajı silindi':'Mesaj silindi')+(info?': '+info:''),'del');
    setBy(r,me,byTxt||'bilinmiyor',!byTxt);

function check(d,u){
  const txt=d.content||'',reasons=[],low=txt.toLowerCase();
  if(badWords.some(w=>low.includes(w)))reasons.push(['yasaklı kelime',1]);
  if($('fLink').checked&&/(https?:\/\/|www\.|\b[a-z0-9-]+\.(com|net|org|tv|gg|io|xyz|ru|co)\b)/i.test(txt.replace(/\[emote:\d+:[^\]]+\]/g,'')))reasons.push(['LİNK',1]);
  const clean=txt.replace(/\[emote:\d+:[^\]]+\]/g,'').replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g,'');
  if($('fCaps').checked&&clean.length>=12&&clean.replace(/[^A-ZÇĞİÖŞÜ]/g,'').length/clean.length>0.7)reasons.push(['BÜYÜK HARF',1]);
  if($('fRep').checked){
    if((u.last||[]).includes(low)&&low.length>3)reasons.push(['tekrar']);
    if(/(.)\1{9,}/.test(txt))reasons.push(['harf spam']);
    const now=Date.now();u.rate=(u.rate||[]).filter(t=>now-t<8000);u.rate.push(now);
    if(u.rate.length>=6)reasons.push(['hızlı yazıyor']);
  }
  if($('fLong').checked&&txt.length>300)reasons.push(['uzun']);
  return reasons;
}

  const s=d.sender||{},name=s.username||'?';

  const top=Object.values(users).sort((a,b)=>b.count-a.count).slice(0,5).map(u=>'<div>'+esc(u.name)+' <span class="small">'+u.count+'</span></div>').join('')||'<span class="small">—</span>';
  $('statbox').innerHTML='<div class="stats"><div class="stat"><b>'+total+'</b><span>mesaj</span></div><div class="stat"><b>'+Object.keys(users).length+'</b><span>benzersiz kullanıcı</span></div><div class="stat"><b>'+per+'</b><span>mesaj/dk (şimdi)</span></div><div class="stat"><b>'+last5.toFixed(1)+'</b><span>mesaj/dk (5 dk ort.)</span></div><div class="stat"><b>'+flagged+'</b><span>işaretlenen</span></div><div class="stat"><b>'+(counts.ban+counts.del)+'</b><span>mod işlemi ('+counts.ban+' ban/timeout, '+counts.del+' silme)</span></div></div>'+
  '<h4>Son 15 dakika</h4>'+svg+'<h4>En çok yazanlar</h4>'+top;
}
const uptime=st=>{if(!st)return'—';const s=Math.max(0,(Date.now()-new Date(st))/1000|0),h=s/3600|0,m=(s%3600)/60|0;return h+'sa '+m+'dk'};
function modesHtml(){
  if(!MODES)return'<span class="small">Mod değişince burada görünür.</span>';
  const t=(on,a,b)=>'<span class="tag '+(on?'on':'')+'">'+(on?a:b)+'</span>';
  const sl=MODES.slow_mode||{},fo=MODES.followers_mode||{},em=MODES.emotes_mode||{},sb=MODES.subscribers_mode||{};
  return t(sl.enabled,'Yavaş '+(sl.message_interval||'')+'s','Yavaş: kapalı')+t(fo.enabled,'Sadece takipçi','Takipçi: kapalı')+t(em.enabled,'Emote modu','Emote: kapalı')+t(sb.enabled,'Abone modu','Abone: kapalı');
}
function renderStream(){
  const el=$('streambox');
  if(!SI){el.innerHTML='<div class="small">Giriş yapıp kanala bağlanınca yayın bilgisi burada görünür.</div>';return}
  if(SI.is_live)PEAK=Math.max(PEAK,SI.viewers||0);
  el.innerHTML='<span class="live '+(SI.is_live?'on':'')+'">'+(SI.is_live?'● CANLI':'○ Çevrimdışı')+'</span><div class="ttl">'+esc(SI.title||'(başlık yok)')+'</div><div class="small">'+esc(SI.category||'Kategori yok')+(SI.language?' • '+esc(SI.language):'')+'</div>'+
  '<div class="stats" style="margin-top:10px"><div class="stat"><b>'+(SI.is_live?SI.viewers:'—')+'</b><span>izleyici</span></div><div class="stat"><b>'+(SI.is_live?PEAK:'—')+'</b><span>oturum zirvesi</span></div><div class="stat" style="grid-column:span 2"><b>'+(SI.is_live?uptime(SI.start_time):'—')+'</b><span>yayın süresi</span></div></div>'+
  '<h4>Sohbet modları</h4>'+modesHtml()+'<div class="small" style="margin-top:8px">Son güncelleme: '+hm(SI.fetched)+'</div>';
}
async function pollStream(){
  const slug=$('slug').value.trim();if(!auth||!slug||!bid)return;
  try{const c=await api('/api/channel?slug='+encodeURIComponent(slug));SI=c;SI.fetched=Date.now();renderStream()}catch(e){}
}
setInterval(pollStream,30000);setInterval(()=>{if(SI&&SI.is_live)renderStream()},15000);setInterval(stats,10000);

/* ================= GÜNCELLEME ================= */
let UPD=null;
async function checkUpdate(silent){
  try{
    const u=await api('/api/update/check');UPD=u;$('ver').textContent='v'+u.current;
    if(!u.configured){if(!silent)alert('Otomatik güncelleme için config.json içine "updateUrl" eklemelisin. OKU-BENI.txt dosyasında anlatılıyor.');return}
    if(u.newer){$('upd').classList.add('pri');$('ver').textContent='v'+u.current+' → v'+u.latest+' güncelle';if(!silent)applyUpdate()}
    else if(!silent)toast('Güncelsin (v'+u.current+')');
  }catch(e){if(!silent)toast('Kontrol edilemedi: '+e.message)}
}
async function applyUpdate(){
  if(!UPD||!UPD.newer)return;
  if(!confirm('v'+UPD.latest+' sürümüne güncellensin mi?\n'+(UPD.notes?'\n'+UPD.notes+'\n':'')+'\nAyarların, notların ve giriş bilgin korunur.'))return;
  try{
    const r=await api('/api/update/apply',{});
    if(r.updated){toast('Güncellendi, yeniden başlatılıyor…');const t=setInterval(async()=>{try{await fetch('/api/me');clearInterval(t);location.reload()}catch(e){}},1500)}
  }catch(e){toast('Güncelleme hatası: '+e.message)}
}
$('upd').onclick=()=>{if(UPD&&UPD.newer)applyUpdate();else checkUpdate(false)};

/* ================= BAŞLAT ================= */
renderStream();stats();buildMenu();
sys($('room').value?'Kayıtlı ayarlar yüklendi. Bağlan\'a basabilirsin.':'Kanal adını yaz, Bağlan\'a bas.');
initAuth().then(()=>checkUpdate(true));
</script>
</body>
</html>
